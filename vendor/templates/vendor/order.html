{% extends 'base.html' %}
{% block title %}Order Details{% endblock %}
{% block content %}
<div class="container mt-5">
    <h2 class="mb-4">Order Details</h2>
    <style>
        .table th, .table td { 
            vertical-align: middle; 
            text-align: center;
        }

        .btn-equal {
            min-width: 70px !important;   
            height: 28px !important;     
            font-size: 0.8rem !important; 
            padding: 3px 8px;             
            white-space: nowrap;
            background: rgb(11, 25, 55);
            color: rgb(255, 255, 255) !important;
            border: none;
            border-radius: 14px;          
            font-weight: 500;
            box-shadow: 0 2px 6px rgba(11, 25, 55, 0.25);
            transition: background 0.3s, color 0.3s;
            display: inline-block;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .btn-equal:hover {
            background: rgb(255, 255, 255);
            color: rgb(11, 25, 55) !important;
            border: 1px solid rgb(11, 25, 55);
        }

        .page-link {
            min-width: 60px;            
            height: 28px;               
            border-radius: 14px !important; 
            font-size: 0.8rem;         
            font-weight: 500;
            background: rgb(11, 25, 55);
            color: white !important;
            border: none;
            margin: 0 2px;
            box-shadow: 0 2px 6px rgba(11, 25, 55, 0.25);
            text-align: center !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
        }
    
        .page-link:hover {
            background: white !important;
            color: rgb(11, 25, 55) !important;
            border: 1px solid rgb(11, 25, 55);
        }
    
        .page-item.active .page-link {
            background: rgb(11, 25, 55) !important;
            color: white !important;
            border: none;
        }
    
        .page-item {
            list-style: none;   /* removes the bullet */
        }    
    
        /* Pagination Input + Text */
        .page-input {
            height: 28px;              
            width: 50px;                
            font-size: 0.8rem;
            text-align: center;
            border-radius: 14px;
            border: 1px solid #ccc;
            padding: 2px;
        }
    
        .page-total {
            font-size: 0.8rem;
            line-height: 28px;          
            color: #6c757d;             
        }
    
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px; 
        }
        
        .pagination .form-control-sm {
            height: 36px;
            padding: 0;
        }

        @media (max-width: 576px) {
    
            .page-link {
                min-width: 60px;
                font-size: 0.8rem;
                padding: 4px 8px;
            }
        }

    </style>

<div id="ordersTableWrapper">
    {% include "vendor/order_table.html" %}
</div>

{% if page_obj %}
<div id="ordersPaginationWrapper">
    {% include "includes/pagination.html" with position="bottom" %}
</div>
{% endif %}

<script>
(function() {
    const selectAll = document.getElementById('select-all');
    if (!selectAll) return;
    const rowChecks = document.querySelectorAll('.row-checkbox');
    selectAll.addEventListener('change', function() {
        rowChecks.forEach(cb => cb.checked = selectAll.checked);
        selectAll.indeterminate = false;
    });
    rowChecks.forEach(cb => {
        cb.addEventListener('change', function() {
            const total = rowChecks.length;
            const checked = Array.from(rowChecks).filter(x => x.checked).length;
            selectAll.checked = checked === total;
            selectAll.indeterminate = checked > 0 && checked < total;
        });
    });
})();

// Page input functionality
const pageInput = document.getElementById('pageInput');
if (pageInput) {
    pageInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            goToPage();
        }
    });
    
    pageInput.addEventListener('blur', function() {
        goToPage();
    });
}

function goToPage() {
    const pageInput = document.getElementById('pageInput');
    if (!pageInput) return;
    
    let pageNum = parseInt(pageInput.value);
    const maxPages = parseInt(pageInput.getAttribute('max'));
    
    // Validate page number
    if (isNaN(pageNum) || pageNum < 1) {
        pageNum = 1;
    } else if (pageNum > maxPages) {
        pageNum = maxPages;
    }
    
    // Build URL with current parameters
    const currentUrl = new URL(window.location);
    currentUrl.searchParams.set('page', pageNum);
    
    // Redirect to the new page
    window.location.href = currentUrl.toString();
}

document.addEventListener("DOMContentLoaded", () => {
    const csrfToken = "{{ csrf_token }}";
  
    document.querySelectorAll(".mark-processed").forEach(btn => {
      btn.addEventListener("click", () => {
        const itemId = btn.dataset.id;
        fetch(`/vendor/process-order-item/${itemId}/`, {
          method: "POST",
          headers: {
            "X-CSRFToken": csrfToken,
            "X-Requested-With": "XMLHttpRequest"
          }
        })
        .then(resp => resp.json())
        .then(data => {
          if (data.success) {
            // Replace button with badge
            btn.outerHTML = `<span class="badge bg-success">${data.status}</span>`;
          } else {
            alert("Already " + data.status);
          }
        })
        .catch(err => console.error("Error:", err));
      });
    });

    function loadOrders(url) {
        fetch(url, { headers: { "X-Requested-With": "XMLHttpRequest" }})
          .then(resp => resp.json())
          .then(data => {
            document.querySelector("#ordersTableWrapper").innerHTML = data.table_html;
            document.querySelector("#ordersPaginationWrapper").innerHTML = data.pagination_html;
          })
          .catch(err => console.error("Error:", err));
      }
    
      // Handle clicks
      document.addEventListener("click", e => {
        const link = e.target.closest("#ordersPaginationWrapper a.page-link");
        if (!link) return;
        e.preventDefault();
        loadOrders(link.href);
        history.pushState({}, "", link.href);
      });
    
      // Handle page input
      document.addEventListener("change", e => {
        if (!e.target.closest("#ordersPaginationWrapper .page-input")) return;
        let page = parseInt(e.target.value);
        const max = parseInt(e.target.max);
        if (isNaN(page) || page < 1) page = 1;
        if (page > max) page = max;
        const url = new URL(window.location);
        url.searchParams.set("page", page);
        loadOrders(url.toString());
        history.pushState({}, "", url);
      });

      const wrapper = document.getElementById("ordersTableWrapper");
        if (wrapper) {
        const headerOffset = 120; // adjust as needed
        const elementPosition = wrapper.getBoundingClientRect().top + window.pageYOffset;
        window.scrollTo({ top: elementPosition - headerOffset, behavior: "smooth" });
        }

  });
</script>
{% endblock %}
