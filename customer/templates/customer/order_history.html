{% extends "base.html" %}
{% load static %}
{% block title %}Order History{% endblock %}

{% block content %}
<div class="container-fluid px-2 px-md-4">

<style>
    .equal-button {
    min-width: 70px !important;
    height: 28px !important;
    font-size: 0.8rem !important;
    padding: 3px 8px;
    white-space: nowrap;
    background: rgb(11, 25, 55);   /* dark blue */
    color: #fff !important;
    border: none;
    border-radius: 14px;
    font-weight: 500;
    box-shadow: 0 2px 6px rgba(11, 25, 55, 0.25);
    transition: background 0.3s, color 0.3s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    text-align: center;
}

.equal-button:hover {
    background: #fff;
    color: rgb(11, 25, 55) !important;
    border: 1px solid rgb(11, 25, 55);
}

.page-link {
        min-width: 60px;
        height: 28px;
        border-radius: 14px !important;
        font-size: 0.8rem;
        font-weight: 500;
        background: rgb(11, 25, 55);
        color: white !important;
        border: none;
        margin: 0 2px;
        box-shadow: 0 2px 6px rgba(11, 25, 55, 0.25);
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
    }

    .page-link:hover {
        background: white !important;
        color: rgb(11, 25, 55) !important;
        border: 1px solid rgb(11, 25, 55);
    }

    .page-item.active .page-link {
        background: rgb(11, 25, 55) !important;
        color: white !important;
        border: none;
    }

    .page-item {
        list-style: none;
    }    

    .page-input {
        height: 28px;
        width: 50px;
        font-size: 0.8rem;
        text-align: center;
        border-radius: 14px;
        border: 1px solid #ccc;
        padding: 2px;
    }

    .page-total {
        font-size: 0.8rem;
        line-height: 28px;
        color: #6c757d;
    }

    .pagination {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
    }
    
    .pagination .form-control-sm {
        height: 36px;
        padding: 0;
    }

.order-history-table {
    color: #222;
    background-color: #fff;
    border-collapse: separate;
    border-spacing: 0 5px;
    width: 100%;
    border-radius: 15px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    overflow: hidden;
    margin: 40px auto 0 auto;
    min-width: 700px;
    max-width: 1200px;
}
.order-history-table th, .order-history-table td {
    padding: 2px;
    text-align: center;
    vertical-align: middle;
    background-color: #fff;
    border-bottom: 1px solid #e3e3e3;
}
.order-history-table th {
    padding: 8px;
    background-color: #e6f4fa;
    color: rgb(11, 25, 55);
    font-weight: 600;
    position: sticky;
    top: 0;
    z-index: 2;
    white-space: normal;
    word-wrap: break-word;
    font-size: 0.9rem;
    border-bottom: 2px solid rgb(11, 25, 55);
}

/* product/item styling */
.order-history-info {
    text-align: left;
    display: inline-block;
    width: auto;
    min-width: unset;
}
.order-history-title {
    font-size: 1.1rem;
    font-weight: 500;
    color: #222;
    display: block;
}
.shape-icon-label {
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    padding: 6px 0;
    border-radius: 12px;
    transition: box-shadow 0.2s, border 0.2s;
    border: 2px solid transparent;
    background: #fff;
    max-width: 60px;
    font-size: 0.75rem;
    margin-right: 12px;
}
.shape-icon-label .shape-svg {
    width: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
}
.shape-label {
    font-size: 0.75rem;
    color: #222;
    margin-top: 4px;
    font-weight: 500;
}

.items-list {
    margin: 8px 0 0 0;
    padding: 0;
    list-style-position: inside;
    text-align: center;
}
.items-list li {
    display: block;
}

/* Mobile view fix */
@media (max-width: 768px) {
    .table-responsive {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
    }

    table.table {
        font-size: 0.85rem;   /* small font for better fit */
    }

    table.table th,
    table.table td {
        white-space: nowrap;  /* stop text from breaking awkwardly */
        vertical-align: middle;
    }

    /* Items details center in mobile */
    .items-list {
        text-align: left;   /* better readability in phone */
        font-size: 0.8rem;
    }  
  
   .page-link {
            min-width: 60px;
            font-size: 0.8rem;
            padding: 4px 8px;
        }
}

@media (max-width: 900px) {
    .order-history-table {
        min-width: 600px;
    }
}
@media (max-width: 700px) {
    .order-history-table {
        min-width: 500px;
    }
    .order-history-info {
        min-width: 100px;
    }
}
@media (max-width: 576px) {
    .order-history-table th, .order-history-table td {
        padding: 6px 8px;
        font-size: 0.75rem;
    }
    .order-history-table {
        min-width: 400px;
    }
}

</style>

<div id="orderHistoryWrapper">
    {% if page_obj %}
        {% include "customer/order_history_table.html" %}
    {% else %}
    <div class="text-center mt-5">
        <p class="mb-3">You haven't placed any orders.</p>
        <a href="{% url 'dashboard' %}" class="btn equal-button">Browse Diamonds</a>
    </div>
    {% endif %}
</div>
<script src="{% static 'js/common.js' %}"></script>
<script>
    document.addEventListener("DOMContentLoaded", () => {
        function loadOrders(url) {
            fetch(url, { headers: { "X-Requested-With": "XMLHttpRequest" }})
            .then(resp => resp.json())
            .then(data => {
                document.getElementById("orderHistoryWrapper").innerHTML = data.table_html;
                document.getElementById("order-pagination").innerHTML = data.pagination_html;
                initPageInput("#order-pagination", loadOrders);
                initSelectAllFeature("orderHistoryWrapper");
                scrollToWrapper("orderHistoryWrapper");
            })
            .catch(err => console.error("Order load failed", err));
        }
        
        document.addEventListener("click", e => {
            const link = e.target.closest("a.ajax-link");
            if (!link) return;
            e.preventDefault();
            loadOrders(link.href);
            history.pushState({}, "", link.href);
        });
        
        initPageInput("#order-pagination", loadOrders);
        initSelectAllFeature("orderHistoryWrapper");
        scrollToWrapper("orderHistoryWrapper");
</script>
{% endblock %}
