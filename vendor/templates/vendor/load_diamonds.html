{% extends 'base.html' %}
{% block title %}Your Diamonds{% endblock %}

{% block content %}
<h2 class="mb-4">Your Diamonds</h2>

<style>
    table.table thead.table-dark th {
        background-color: #e6f4fa !important;
        color:  rgb(11, 25, 55) !important;               
        text-align: center;
        vertical-align: middle;
        white-space: normal !important;
        word-wrap: break-word;
        font-size: 0.9rem;
    }

    .table-container {
        overflow-x: auto;
    }

    .table th, .table td {
        white-space: nowrap;
        text-align: center;
        vertical-align: middle;
        font-size: 0.9rem;
    }
    
    /* Shared Button Styles (Edit button) */
    .edit-btn {
        min-width: 70px !important;   /* reduced from 90px */
        height: 28px !important;      /* reduced from 36px */
        font-size: 0.8rem !important; /* smaller font size */
        padding: 3px 8px;             /* reduced padding */
        white-space: nowrap;
        background: rgb(11, 25, 55);
        color: rgb(255, 255, 255) !important;
        border: none;
        border-radius: 14px;          /* smaller radius to match new size */
        font-weight: 500;
        box-shadow: 0 2px 6px rgba(11, 25, 55, 0.25);
        transition: background 0.3s, color 0.3s;
        display: inline-block;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    /* Hover styles for Edit button */
    .edit-btn:hover {
        background: rgb(255, 255, 255);
        color: rgb(11, 25, 55) !important;
        border: 1px solid rgb(11, 25, 55);
    }

    /* Delete button - same size as Edit */
    .btn-delete {
        min-width: 70px !important;   /* reduced from 90px */
        height: 28px !important;      /* reduced from 36px */
        font-size: 0.8rem !important; /* smaller font size */
        padding: 3px 8px;             /* reduced padding */
        white-space: nowrap;
        background:  #dc3545;
        color: rgb(255, 255, 255) !important;
        border: none;
        border-radius: 14px;          /* smaller radius to match new size */
        font-weight: 500;
        box-shadow: 0 2px 8px rgba(220, 53, 69, 0.3);
        transition: background 0.3s, color 0.3s;
        display: inline-block;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    /* Delete button hover effect */
    .btn-delete:hover {
        background: #fff !important;
        color: #dc3545 !important;
        border: 1px solid #dc3545 !important;
    }

    .page-link {
        min-width: 60px;            /* smaller width */
        height: 28px;               /* smaller height */
        border-radius: 14px !important; /* adjusted radius */
        font-size: 0.8rem;          /* smaller text */
        font-weight: 500;
        background: rgb(11, 25, 55);
        color: white !important;
        border: none;
        margin: 0 2px;
        box-shadow: 0 2px 6px rgba(11, 25, 55, 0.25);
        text-align: center !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
    }

    .page-link:hover {
        background: white !important;
        color: rgb(11, 25, 55) !important;
        border: 1px solid rgb(11, 25, 55);
    }

    .page-item.active .page-link {
        background: rgb(11, 25, 55) !important;
        color: white !important;
        border: none;
    }

    .page-item {
        list-style: none;   /* removes the bullet */
    }    

    /* Pagination Input + Text */
    .page-input {
        height: 28px;               /* match button height */
        width: 50px;                /* compact */
        font-size: 0.8rem;
        text-align: center;
        border-radius: 14px;
        border: 1px solid #ccc;
        padding: 2px;
    }

    .page-total {
        font-size: 0.8rem;
        line-height: 28px;          /* vertically aligned */
        color: #6c757d;             /* muted text color */
    }

    .pagination {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px; /* spacing between elements */
    }
    
    .pagination .form-control-sm {
        height: 36px;
        padding: 0;
    }

    @media (max-width: 768px) {
        .table th, .table td {
            font-size: 0.75rem;
            padding: 6px;
        }

        .page-link {
            min-width: 60px;
            font-size: 0.8rem;
            padding: 4px 8px;
        }
        [data-confirm-box] {
            display: block;
            margin-top: 5px;
        }
    
        [data-confirm-box] a,
        [data-confirm-box] button {
            display: block;
            width: 100%;
            margin-top: 4px;
        }
    }
    
</style>

<div id="diamondsTableWrapper">
    {% include "vendor/load_diamonds_table.html" %}
</div>

{% if page_obj %}
<div id="diamondsPaginationWrapper">
    {% include "includes/pagination.html" with position="bottom" %}
</div>
{% endif %}

<script src="{% static 'js/common.js' %}"></script>
<script>
function showConfirm(button) {
  document.querySelectorAll('[data-confirm-box]').forEach(box => {
    box.classList.add('d-none');
    if (box.previousElementSibling) box.previousElementSibling.style.display = 'inline-block';
  });
  const confirmBox = button.nextElementSibling;
  confirmBox.classList.remove('d-none');
  button.style.display = 'none';
}
function cancelDelete(button) {
  const confirmBox = button.parentElement;
  const deleteBtn = confirmBox.previousElementSibling;
  confirmBox.classList.add('d-none');
  deleteBtn.style.display = 'inline-block';
}
function confirmDelete(button) {
  const confirmBox = button.parentElement;
  const deleteUrl = confirmBox.previousElementSibling.getAttribute('data-url');
  window.location.href = deleteUrl;
}

document.addEventListener("DOMContentLoaded", () => {
  function loadDiamonds(url) {
    fetch(url, { headers: { "X-Requested-With": "XMLHttpRequest" }})
      .then(resp => resp.json())
      .then(data => {
        document.querySelector("#diamondsTableWrapper").innerHTML = data.table_html;
        document.querySelector("#diamondsPaginationWrapper").innerHTML = data.pagination_html;
      })
      .catch(err => console.error("Error:", err));
  }

  document.addEventListener("click", e => {
    const link = e.target.closest("#diamondsPaginationWrapper a.page-link");
    if (!link) return;
    e.preventDefault();
    loadDiamonds(link.href);
    history.pushState({}, "", link.href);
  });

  initPageInput("#diamondsPaginationWrapper", loadDiamonds);
  initSelectAllFeature("diamondsTableWrapper");
  scrollToWrapper("diamondsTableWrapper");
});
</script>
{% endblock %}
